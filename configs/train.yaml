# Shared trainer defaults (design §6). Model configs extend this file.
env: pendulum
obs_mode: state
seed: 0
data_root: data
results_root: results
train:
  steps: 30000          # state models; pixel model configs override to 60000
  batch: 128            # windows per step
  lr: 3.0e-4
  weight_decay: 1.0e-2  # AdamW default
  grad_clip: 10.0
  curriculum:           # horizon H used from the given fraction of training on
    horizons: [4, 8, 16, 32]
    at: [0.0, 0.2, 0.4, 0.6]
  eval_every: 500
  val_horizon: 32       # early stopping on val 32-step normalised MSE
  val_windows: 1024
  patience: 10          # evals without improvement, counted only once the final horizon is reached
  device: auto          # auto | cpu | cuda
  max_params: 5000000   # Req 6.3
