[project]
name = "hamiltonian-world-models"
version = "0.1.0"
description = "Action-conditioned Hamiltonian world models with symplectic integration, for long-horizon prediction and control."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Shushant Kumar Choudhary" }]
requires-python = ">=3.12"
dependencies = [
    "torch>=2.6",
    "numpy>=2.0",
    "scipy>=1.13",
    "pyyaml>=6.0",
    "matplotlib>=3.9",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["hwm"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
